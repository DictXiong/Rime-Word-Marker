<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="词库标注器" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>导入导出 - Rime Word Marker</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-icon-180.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="import">
    <div class="aurora aurora-left"></div>
    <div class="aurora aurora-right"></div>

    <main class="app-shell">
      <header class="hero page-hero">
        <div>
          <p class="eyebrow">Import / Export</p>
          <h1>词库导入与导出</h1>
        </div>
      </header>

      <nav class="top-nav">
        <a class="nav-chip" href="/">首页</a>
        <a class="nav-chip" href="/review">筛词</a>
        <a class="nav-chip active" href="/import">导入 / 导出</a>
        <a class="nav-chip" href="/manage">词库管理</a>
      </nav>

      <section class="grid-two">
        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>词库导入</h2>
            </div>
          </div>

          <form id="importForm" class="stack-form">
            <label class="field">
              <span>选择文件</span>
              <input type="file" id="importFile" accept=".txt,.yaml,.dict,.dict.yaml" />
            </label>

            <label class="field">
              <span>粘贴词库内容</span>
              <textarea
                id="importText"
                rows="14"
                placeholder="每行一个词条，列之间使用 Tab 分隔：&#10;词条&#9;拼音&#9;词频"
              ></textarea>
            </label>

            <div class="field">
              <span>重复词条处理</span>
              <div class="checkbox-grid">
                <label
                  class="has-tip"
                  data-tip="重复词条仅在导入行提供拼音时覆盖原拼音；不能和“忽略拼音”同时启用。"
                ><input type="checkbox" id="importOverwritePinyin" /> 覆盖拼音</label>
                <label
                  class="has-tip"
                  data-tip="丢弃导入文件中的拼音。新词条会使用内置拼音生成；已有重复词条不会因此重算拼音。"
                ><input type="checkbox" id="importIgnorePinyin" /> 忽略拼音</label>
                <label
                  class="has-tip"
                  data-tip="重复词条仅在导入行提供词频时更新，并保留原词频和导入词频中的较大值。"
                ><input type="checkbox" id="importOverwriteWeight" checked /> 更新词频</label>
                <label
                  class="has-tip"
                  data-tip="把本次导入涉及的词条直接人工标注为接受，包括新词条和重复词条。"
                ><input type="checkbox" id="importMarkAccepted" /> 全部接受</label>
                <label
                  class="has-tip"
                  data-tip="导入文件中的新词条会被跳过，只按其它选项更新数据库中已有的重复词条。"
                ><input type="checkbox" id="importSkipNewEntries" /> 不新建词条</label>
                <label
                  class="has-tip"
                  data-tip="在写入导入结果前，把当前 SQLite 数据库备份为同目录的 .backup_时间戳 文件。"
                ><input type="checkbox" id="importBackupBeforeImport" /> 导入前备份</label>
              </div>
            </div>

            <button class="primary-button" type="submit">导入词库</button>
            <div class="message-box" id="importMessage"></div>
          </form>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>词库导出</h2>
            </div>
          </div>

          <form id="exportForm" class="stack-form">
            <label class="field">
              <span>导出词典名称</span>
              <input type="text" id="exportName" value="rime_word_marker_export" />
            </label>

            <div class="field">
              <span>包含状态</span>
              <div class="checkbox-grid">
                <label
                  class="has-tip"
                  data-tip="导出人工状态为“接受”的词条。默认启用。"
                ><input type="checkbox" name="exportStatus" value="accepted" checked /> 接受</label>
                <label
                  class="has-tip"
                  data-tip="导出仍处于待定状态的词条；如果启用 AI 辅助，部分待定词条会按 AI 结果计入接受或拒绝。"
                ><input type="checkbox" name="exportStatus" value="pending" /> 待定</label>
                <label
                  class="has-tip"
                  data-tip="导出人工状态为“拒绝”的词条，通常仅用于检查或调试。"
                ><input type="checkbox" name="exportStatus" value="rejected" /> 拒绝</label>
              </div>
            </div>

            <label
              class="field inline has-tip"
              data-tip="导出行会包含第三列词频：词条、拼音、词频。"
            >
              <input type="checkbox" id="includeWeight" checked />
              <span>导出时包含词频</span>
            </label>

            <label
              class="field inline has-tip"
              data-tip="人工状态仍为待定、但 AI 标注为接受或拒绝的词条，会按 AI 结果参与导出。"
            >
              <input type="checkbox" id="includeAiAssist" checked />
              <span>包含 AI 辅助</span>
            </label>

            <label
              class="field inline has-tip"
              data-tip="勾选后不输出 Rime YAML 文件头，导出文件第一行直接从词条开始。"
            >
              <input type="checkbox" id="omitYamlHeader" />
              <span>不包含 YAML 文件头</span>
            </label>

            <div class="field">
              <span>导出类型</span>
              <div class="checkbox-grid export-mode-grid">
                <label
                  class="has-tip"
                  data-tip="导出普通 Rime 词典，排除中英混杂/全英文词条。"
                ><input type="radio" name="exportMode" value="main" checked /> 主词库</label>
                <label
                  class="has-tip"
                  data-tip="中英混杂词汇必须单独导出为专用词典。选择后只导出含英文词条。"
                ><input type="radio" name="exportMode" value="mixed" /> 中英混杂词库</label>
                <label
                  class="has-tip"
                  data-tip="导出 OpenCC 扩展词典：每行格式为“输入内容、一个 Tab、输入内容原样和延伸词”。"
                ><input type="radio" name="exportMode" value="opencc" /> OpenCC 延伸词</label>
              </div>
            </div>

            <div class="field" id="mixedExportPanel">
              <span>中英混杂编码</span>
              <div class="export-mixed-options">
                <select
                  class="has-tip"
                  id="mixedPinyinScheme"
                  data-tip="选择中英混杂词汇的编码方案。全拼会合并为一个整体；双拼会按所选方案转换。"
                >
                  <option value="full_pinyin">全拼</option>
                  <option value="ziranma">自然码双拼</option>
                  <option value="abc">智能 ABC 双拼</option>
                  <option value="flypy">小鹤双拼</option>
                  <option value="microsoft">微软双拼</option>
                  <option value="sogou">搜狗双拼</option>
                  <option value="ziguang">紫光双拼</option>
                </select>
              </div>
            </div>

            <button class="primary-button alt" type="submit">导出词库</button>
            <p class="export-count-note" id="exportCountNote">当前选择将导出 0 条词条。</p>
          </form>
        </article>
      </section>
    </main>

    <div class="loading-overlay" id="importLoadingOverlay" hidden>
      <div class="loading-panel">
        <div class="loading-spinner" aria-hidden="true"></div>
        <strong>导入中</strong>
        <p id="importLoadingText">正在处理词库，请稍候。导入完成前请不要重复点击或切换操作。</p>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
