<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="词库标注器" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>导入导出 - Rime Word Marker</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-icon-180.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="import">
    <div class="aurora aurora-left"></div>
    <div class="aurora aurora-right"></div>

    <main class="app-shell">
      <header class="hero page-hero">
        <div>
          <p class="eyebrow">Import / Export</p>
          <h1>词库导入与导出</h1>
        </div>
      </header>

      <nav class="top-nav">
        <a class="nav-chip" href="/">首页</a>
        <a class="nav-chip" href="/review">筛词</a>
        <a class="nav-chip active" href="/import">导入 / 导出</a>
        <a class="nav-chip" href="/manage">词库管理</a>
      </nav>

      <section class="grid-two">
        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>词库导入</h2>
            </div>
          </div>

          <form id="importForm" class="stack-form">
            <label class="field">
              <span>选择文件</span>
              <input type="file" id="importFile" accept=".txt,.yaml,.dict,.dict.yaml" />
            </label>

            <label class="field">
              <span>粘贴词库内容</span>
              <textarea
                id="importText"
                rows="14"
                placeholder="每行一个词条，列之间使用 Tab 分隔：&#10;词条&#9;拼音&#9;词频"
              ></textarea>
            </label>

            <div class="field">
              <span>重复词条处理</span>
              <div class="checkbox-grid">
                <label><input type="checkbox" id="importOverwritePinyin" /> 覆盖拼音</label>
                <label><input type="checkbox" id="importIgnorePinyin" /> 忽略拼音</label>
                <label><input type="checkbox" id="importOverwriteWeight" checked /> 更新词频</label>
                <label><input type="checkbox" id="importMarkAccepted" /> 全部接受</label>
              </div>
            </div>

            <button class="primary-button" type="submit">导入词库</button>
            <p class="form-note">
              支持直接上传 Rime 风格词典文件，或手动粘贴内容。新词条缺失拼音会补全，缺失词频会设为 1；重复词条仅在导入行提供对应列且勾选对应选项时更新。“忽略拼音”会丢弃导入文件中的拼音并使用内置拼音生成，不能和“覆盖拼音”同时启用。勾选“更新词频”时会保留原词频和导入词频中的较大值；勾选“全部接受”会把本次导入涉及的词条直接标注为接受。
            </p>
            <div class="message-box" id="importMessage"></div>
          </form>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <h2>词库导出</h2>
            </div>
          </div>

          <form id="exportForm" class="stack-form">
            <label class="field">
              <span>导出词典名称</span>
              <input type="text" id="exportName" value="rime_word_marker_export" />
            </label>

            <div class="field">
              <span>包含状态</span>
              <div class="checkbox-grid">
                <label><input type="checkbox" name="exportStatus" value="accepted" checked /> 接受</label>
                <label><input type="checkbox" name="exportStatus" value="pending" /> 待定</label>
                <label><input type="checkbox" name="exportStatus" value="rejected" /> 拒绝</label>
              </div>
            </div>

            <label class="field inline">
              <input type="checkbox" id="includeWeight" />
              <span>导出时包含词频</span>
            </label>

            <label class="field inline">
              <input type="checkbox" id="includeAiAssist" checked />
              <span>包含 AI 辅助</span>
            </label>

            <button class="primary-button alt" type="submit">导出为 Rime YAML</button>
            <p class="export-count-note" id="exportCountNote">当前选择将导出 0 条词条。</p>
          </form>
        </article>
      </section>
    </main>

    <div class="loading-overlay" id="importLoadingOverlay" hidden>
      <div class="loading-panel">
        <div class="loading-spinner" aria-hidden="true"></div>
        <strong>导入中</strong>
        <p id="importLoadingText">正在处理词库，请稍候。导入完成前请不要重复点击或切换操作。</p>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
