<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="词库标注器" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>词库管理 - Rime Word Marker</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-icon-180.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="manage">
    <div class="aurora aurora-left"></div>
    <div class="aurora aurora-right"></div>

    <main class="app-shell">
      <header class="hero page-hero">
        <div>
          <p class="eyebrow">Manage</p>
          <h1>词库管理</h1>
        </div>
      </header>

      <nav class="top-nav">
        <a class="nav-chip" href="/">首页</a>
        <a class="nav-chip" href="/review">筛词</a>
        <a class="nav-chip" href="/import">导入 / 导出</a>
        <a class="nav-chip active" href="/manage">词库管理</a>
      </nav>

      <article class="panel">
        <div class="panel-head">
          <div>
            <h2>词库管理</h2>
          </div>
        </div>

        <section class="stats-grid compact-stats" id="statsGrid">
          <article class="stat-card">
            <span>总词条</span>
            <strong id="statTotal">0</strong>
          </article>
          <article class="stat-card pending">
            <span>待定</span>
            <strong id="statPending">0</strong>
          </article>
          <article class="stat-card accepted">
            <span>接受</span>
            <strong id="statAccepted">0</strong>
          </article>
          <article class="stat-card rejected">
            <span>拒绝</span>
            <strong id="statRejected">0</strong>
          </article>
        </section>

        <form class="toolbar manage-filter-toolbar" id="manageFilterForm">
          <label class="field compact grow">
            <span>搜索词条 / 拼音</span>
            <input type="text" id="manageQuery" placeholder="支持模糊搜索" />
          </label>

          <label class="field compact slim-field">
            <span>状态</span>
            <select id="manageStatus">
              <option value="all">全部</option>
              <option value="pending">待定</option>
              <option value="accepted">接受</option>
              <option value="rejected">拒绝</option>
            </select>
          </label>

          <label class="field compact slim-field">
            <span>AI 标注</span>
            <select id="manageAiStatus">
              <option value="all">全部</option>
              <option value="none">未标注</option>
              <option value="pending">AI 待定</option>
              <option value="accepted">AI 接受</option>
              <option value="rejected">AI 拒绝</option>
            </select>
          </label>

          <div class="field compact range-field">
            <span>词频范围</span>
            <div class="range-inputs">
              <input type="number" id="manageMinWeight" step="1" placeholder="最小" />
              <input type="number" id="manageMaxWeight" step="1" placeholder="最大" />
            </div>
          </div>

          <label class="field compact page-size-field">
            <span>每页数量</span>
            <select id="managePageSize">
              <option value="20">20</option>
              <option value="30" selected>30</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>

          <button class="primary-button small" type="submit">刷新</button>
        </form>

        <section class="panel-subsection ai-panel" id="aiPanel">
          <div class="ai-panel-head">
            <div>
              <h3>AI 辅助标注</h3>
              <p class="panel-note" id="aiPanelNote">自动使用大模型为人工待定词条生成辅助建议。</p>
            </div>
            <label class="switch-field">
              <input type="checkbox" id="aiEnabledToggle" />
              <span>自动标注</span>
            </label>
          </div>
          <div class="ai-panel-grid">
            <div class="ai-panel-item"><span>人工样本</span><strong id="aiTrainingSummary">-</strong></div>
            <div class="ai-panel-item"><span>AI 队列</span><strong id="aiQueueSummary">-</strong></div>
            <div class="ai-panel-item"><span>后台状态</span><strong id="aiWorkerStatus">-</strong></div>
            <div class="ai-panel-item"><span>模型</span><strong id="aiModelSummary">-</strong></div>
          </div>
          <div class="ai-progress-panel" id="aiProgressPanel" hidden>
            <div class="ai-progress-head">
              <strong id="aiProgressTitle">AI 标注进度</strong>
              <span id="aiProgressMeta">-</span>
            </div>
            <div class="ai-progress-bar" aria-label="AI 标注进度">
              <span class="ai-progress-done" id="aiProgressDone"></span>
              <span class="ai-progress-unlabeled" id="aiProgressUnlabeled"></span>
              <span class="ai-progress-outdated" id="aiProgressOutdated"></span>
            </div>
            <div class="ai-progress-legend">
              <span><i class="legend-done"></i>当前 prompt 已覆盖</span>
              <span><i class="legend-unlabeled"></i>未 AI 标注</span>
              <span><i class="legend-outdated"></i>旧 prompt 待更新</span>
            </div>
          </div>
          <p class="ai-panel-error" id="aiLastError" hidden></p>
        </section>

        <section class="panel-subsection ai-panel maintenance-panel">
          <div class="ai-panel-head">
            <div>
              <h3>全局维护</h3>
            </div>
            <div class="maintenance-actions">
              <button
                class="primary-button small-inline has-tip"
                type="button"
                id="recomputeTonelessPinyinButton"
                data-tip="扫描整库，只把不带声调的拼音用内置拼音重算覆盖。操作前建议先备份数据库。"
              >
                全部重算声调
              </button>
              <button
                class="primary-button small-inline alt has-tip"
                type="button"
                id="capRejectedWeightsButton"
                data-tip="把所有人工拒绝词条的词频截断为 min(10, 原词频)。这是批量写库操作，建议先备份数据库。"
              >
                截断拒绝词频
              </button>
              <button
                class="primary-button small-inline has-tip"
                type="button"
                id="reprocessOutdatedAiButton"
                data-tip="允许后台 AI 重新处理旧 prompt 版本的待定词条。未点击前，旧 prompt 只统计展示，不会自动重算。"
              >
                AI过时重算
              </button>
            </div>
          </div>
          <p class="panel-note" id="maintenanceResult" hidden></p>
        </section>

        <section class="bulk-panel">
          <div class="bulk-meta">
            <strong id="selectedCount">已选择 0 条</strong>
            <span>可跨分页保留选择，再统一处理。</span>
          </div>

          <div class="bulk-actions">
            <button class="ghost-button small-inline" type="button" id="selectPageButton">选择本页</button>
            <button class="ghost-button small-inline" type="button" id="clearSelectionButton">清空选择</button>
            <button class="decision-button mini-accept" type="button" id="bulkAcceptButton">接受</button>
            <button class="decision-button mini-pending" type="button" id="bulkPendingButton">待定</button>
            <button class="decision-button mini-reject" type="button" id="bulkRejectButton">拒绝</button>
            <button class="ghost-button small-inline" type="button" id="bulkLockPinyinButton">锁定拼音</button>
            <button class="ghost-button small-inline" type="button" id="bulkUnlockPinyinButton">解锁拼音</button>
            <button class="primary-button small-inline" type="button" id="openBulkEditButton">编辑</button>
          </div>
        </section>

        <div class="table-shell">
          <div class="entry-table-wrap" id="entryList"></div>
        </div>

        <div class="pagination" id="pagination">
          <button class="ghost-button" id="pagePrev">上一页</button>
          <span id="pageInfo">第 1 / 1 页</span>
          <form class="pagination-jump" id="pageJumpForm">
            <label class="field inline compact pagination-jump-field">
              <span>页码</span>
              <input type="number" id="pageJumpInput" min="1" step="1" inputmode="numeric" value="1" />
            </label>
            <button class="ghost-button" type="submit">跳转</button>
          </form>
          <button class="ghost-button" id="pageNext">下一页</button>
        </div>
      </article>
    </main>

    <dialog class="edit-dialog" id="entryEditDialog">
      <form class="edit-dialog-card" id="entryEditForm" method="dialog">
        <div class="panel-head compact-head">
          <div>
            <p class="section-kicker">词条编辑</p>
            <h2>修改词条信息</h2>
          </div>
          <button class="ghost-button small-inline" type="button" id="entryEditCloseButton">关闭</button>
        </div>

        <input type="hidden" id="editEntryId" />

        <div class="edit-grid">
          <label class="field">
            <span>词条</span>
            <input type="text" id="editPhrase" required />
          </label>

          <label class="field">
            <span>词频</span>
            <input type="number" id="editWeight" step="1" />
          </label>

          <label class="field field-wide">
            <span>拼音</span>
            <input type="text" id="editPinyin" placeholder="支持带声调拼音" />
          </label>

          <div class="field field-wide">
            <span>拼音操作</span>
            <button class="ghost-button small-inline left-align" type="button" id="editAutoPinyinButton">
              根据当前词条自动重算拼音
            </button>
          </div>

          <label class="field">
            <span>状态</span>
            <select id="editStatus">
              <option value="pending">待定</option>
              <option value="accepted">接受</option>
              <option value="rejected">拒绝</option>
            </select>
          </label>

          <label class="field">
            <span>导入时间</span>
            <input type="datetime-local" id="editImportedAt" required />
          </label>

          <label class="field">
            <span>标注时间</span>
            <input type="datetime-local" id="editLabeledAt" />
          </label>
        </div>

        <div class="dialog-actions">
          <button class="ghost-button" type="button" id="editClearLabeledAtButton">清空标注时间</button>
          <button class="primary-button" type="submit">保存全部修改</button>
        </div>
      </form>
    </dialog>

    <dialog class="edit-dialog" id="bulkEditDialog">
      <form class="edit-dialog-card" id="bulkEditForm" method="dialog">
        <div class="panel-head compact-head">
          <div>
            <p class="section-kicker">批量编辑</p>
            <h2>对已选词条统一修改</h2>
          </div>
          <button class="ghost-button small-inline" type="button" id="bulkEditCloseButton">关闭</button>
        </div>

        <div class="edit-grid">
          <label class="field toggle-field field-wide">
            <span><input type="checkbox" id="bulkApplyStatus" /> 统一状态</span>
            <select id="bulkStatus">
              <option value="pending">待定</option>
              <option value="accepted">接受</option>
              <option value="rejected">拒绝</option>
            </select>
          </label>

          <label class="field toggle-field">
            <span><input type="checkbox" id="bulkApplyWeight" /> 统一词频</span>
            <input type="number" id="bulkWeight" step="1" />
          </label>

          <label class="field toggle-field">
            <span><input type="checkbox" id="bulkApplyImportedAt" /> 统一导入时间</span>
            <input type="datetime-local" id="bulkImportedAt" />
          </label>

          <label class="field toggle-field field-wide">
            <span><input type="checkbox" id="bulkApplyPinyin" /> 统一拼音</span>
            <input type="text" id="bulkPinyin" placeholder="为空时会按每个词条自动重算" />
          </label>

          <label class="field toggle-field field-wide">
            <span><input type="checkbox" id="bulkRegeneratePinyin" /> 按各自词条自动重算拼音</span>
            <small class="field-helper">适合导入旧词库后统一补带声调拼音。</small>
          </label>

          <label class="field toggle-field">
            <span><input type="checkbox" id="bulkApplyLabeledAt" /> 统一标注时间</span>
            <input type="datetime-local" id="bulkLabeledAt" />
          </label>

          <label class="field toggle-field">
            <span><input type="checkbox" id="bulkClearLabeledAt" /> 清空标注时间</span>
            <small class="field-helper">清空会覆盖上面的统一标注时间。</small>
          </label>
        </div>

        <div class="dialog-actions">
          <span class="dialog-note" id="bulkTargetSummary">将作用于 0 条词条</span>
          <button class="primary-button" type="submit">应用到所选词条</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
